# V4 experiment: enable supplementary-plane PUAs (full 50k budget instead of BMP-only 6,400).
#
# Hypothesis: with the 100k-file corpus, we have enough baseline_count>=3 candidates
# that the 4-byte cost of supplementary PUA chars is amortized by their token savings.
# Default BMP-only run (v3) capped at 6,400 PUA slots; this run unlocks all 50k.
#
# Everything else identical to configs/default.toml so the A/B is clean.

vocab_size = 120000
pua_budget = 50000
min_bpe_budget = 50000
coverage_target = 0.90
max_token_len = 50
boost_weight = 0.3
min_frequency = 2
seed = 42
workers = 0
shard_size_bytes = 67108864

use_savings_selection = true
strict_pua_atomicity = true
allow_supplementary_pua = true  # ← THE ONE CHANGE vs default

enable_secret_scrub = true
enable_license_filter = false

extensions = [
    ".py", ".js", ".ts", ".tsx", ".jsx",
    ".java", ".c", ".cpp", ".h", ".hpp",
    ".cs", ".rs", ".go", ".rb", ".php",
    ".swift", ".kt", ".scala", ".sh",
    ".sql", ".html", ".css", ".scss",
    ".json", ".yaml", ".yml", ".toml", ".md",
]

special_tokens = [
    "<pad>", "<s>", "</s>", "<unk>",
    "<|endoftext|>", "<|fim_prefix|>", "<|fim_middle|>", "<|fim_suffix|>",
    "<|file_sep|>", "<|repo_name|>",
]

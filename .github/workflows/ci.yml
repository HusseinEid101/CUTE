name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install package + dev deps (maturin builds the Rust extension via PEP 517)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -v

      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src/cute_tokenizer
        continue-on-error: true  # mypy is informational on initial release

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Property tests
        run: pytest tests/property -q

      - name: Integration tests
        run: pytest tests/integration -q -m integration

      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          pytest --cov=cute_tokenizer --cov-report=xml --cov-report=term \
                 tests/unit tests/property tests/integration

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  rust:
    name: Rust toolchain checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rustchecks-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rustchecks-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo test
        run: cargo test -p cute-core

  determinism:
    # Single-OS determinism gate. Cross-platform byte-identity is not part
    # of the contract — see plans/cute-refit.md Step 8 anti-pattern catalog.
    name: Determinism (ubuntu / 3.11)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-determinism-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-determinism-

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -v

      - name: Build twice, hash-compare
        run: |
          pytest tests/integration/test_tokenizer_determinism.py -q -m integration

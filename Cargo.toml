[workspace]
resolver = "2"
members = [
    "rust/cute-core",
    "rust/cute-bpe",
    "rust/cute_tokenizer_accel",
]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/HusseinEid101/CUTE"
authors = ["Hussein Eid <HusseinEid101@users.noreply.github.com>"]

[workspace.dependencies]
regex = { version = "1.11", features = ["unicode", "perf"] }
once_cell = "1.20"
ahash = "0.8"
rayon = "1.10"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aho-corasick = "1.1"
sha2 = "0.10"
hex = "0.4"
fancy-regex = "0.13"
rustc-hash = "2.0"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

# Editable / develop builds: keep optimization on so latency benchmarks are
# representative even without an explicit --release. Use `dev-release-fast`
# only when iterating; production wheels go through release profile.
[profile.dev]
opt-level = 1
debug = 1
